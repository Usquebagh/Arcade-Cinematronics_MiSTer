name: Verify Cinematronics core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL tools
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog yosys
      - name: CPU differential tests without game ROMs
        run: bash sim/run.sh
      - name: Component synthesis
        run: bash tools/synth.sh
      - name: ROM component lint
        run: verilator --lint-only --top-module starcastle_rom -Wall -Wno-UNUSEDSIGNAL rtl/games/starcastle_rom.sv
      - name: Vector rasterizer, framebuffer and video integration tests
        run: bash sim/run_vector.sh
      - name: Vector component synthesis
        run: bash tools/synth_vector.sh
      - name: Connected machine, timers, controls and watchdog tests
        run: bash sim/run_machine.sh
      - name: Sound board controls, voices, envelopes and sample rate
        run: bash sim/run_sound.sh
      - name: Rip Off profiles, two-player controls and shared machine
        run: bash sim/run_ripoff.sh
      - name: Armor Attack 16 KiB mapping and mixed-profile downloads
        run: bash sim/run_armora.sh
      - name: Armor Attack sound, settled explosions and tank divider rates
        run: bash sim/run_armora_sound.sh
      - name: Armor Attack town overlay reproduces licensed source
        run: python3 tools/prepare_armora_overlay.py --check
      - name: Rip Off sound board controls, six effects and sample timing
        run: bash sim/run_ripoff_sound.sh
      - name: Machine component synthesis
        run: bash tools/synth_machine.sh
      - name: MiSTer ROM download, controls, scanout and MRA tests
        run: bash sim/run_mister.sh
      - name: Colour overlay geometry, intensity and bypass
        run: bash sim/run_overlay.sh
